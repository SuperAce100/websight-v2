### model
model_name_or_path: ByteDance-Seed/UI-TARS-1.5-7B
model_revision: main
trust_remote_code: true
image_max_pixels: 262144

# Load SFT checkpoint as starting point
# Expected SFT checkpoint location: saves/ui-tars-1.5-7b/lora/agentnet
# This should be the output directory from train_ui_tars_agentnet.slurm
# If using a specific checkpoint subdirectory, use: saves/ui-tars-1.5-7b/lora/agentnet/checkpoint-XXXX
adapter_name_or_path: saves/ui-tars-1.5-7b/lora/agentnet

### method
stage: kto
do_train: true
finetuning_type: lora
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05
use_rslora: true
lora_target: all

# KTO-specific parameters
pref_beta: 16.0  # Controls balance between reward and KL penalty (typical range: 8-32)
pref_loss: kto    # KTO loss type

### dataset
dataset: agentnet_kto_train
dataset_dir: data
media_dir: /hai/scratch/asanshay/websight-v2/agentnet/images
template: qwen2_vl
cutoff_len: 8192
preprocessing_num_workers: 16
dataloader_num_workers: 4
overwrite_cache: false

### output
output_dir: saves/ui-tars-1.5-7b/lora/agentnet-kto
logging_steps: 10
save_steps: 200
save_strategy: steps
save_total_limit: 3
report_to: tensorboard
plot_loss: true

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 2.0e-5  # Lower than SFT (KTO typically uses 1e-5 to 5e-5)
num_train_epochs: 1.0  # KTO converges faster than SFT
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
ddp_timeout: 180000000
optim: adamw_torch
weight_decay: 0.01
max_grad_norm: 1.0
gradient_checkpointing: true

### misc
deepspeed: configs/deepspeed_zero2.json

